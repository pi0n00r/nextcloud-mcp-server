name: Build and Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact immutable package tag to publish
        required: true
        default: v1.9.8.3
        type: string

env:
  IMAGE_NAME: ghcr.io/pi0n00r/nextcloud-mcp-server
  PACKAGE_TAG: v1.9.8.3
  PACKAGE_VERSION: 0.198.3
  PACKAGE_REVISION: 7f3ff1ef8dedbc55587e0e24abcea5f028e1aee0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate exact immutable tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$INPUT_TAG" != "$PACKAGE_TAG" ]; then
            echo "This workflow only publishes immutable package $PACKAGE_TAG." >&2
            exit 1
          fi

      - name: Checkout package tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}

      - name: Capture checked-out source revision
        id: source
        run: |
          revision=$(git rev-parse HEAD)
          if [ "$revision" != "$PACKAGE_REVISION" ]; then
            echo "Expected source revision $PACKAGE_REVISION, found $revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Validate source version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "$version" != "$PACKAGE_VERSION" ]; then
            echo "Expected pyproject version $PACKAGE_VERSION, found $version" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Build publication distributions
        run: uv build --out-dir publication-dist

      # This runs before registry login or upload. The exact checked-out source
      # and generated wheel/sdist must both pass; the private comparison value
      # is a repository secret and the checker never prints it.
      - name: Preflight immutable package inputs
        env:
          AI_NOTICE_OPERATOR_L1: ${{ secrets.AI_NOTICE_OPERATOR_L1 }}
        run: |
          uv run --python 3.11 python scripts/check_publication_identity.py \
            --git-tree . \
            --candidate publication-dist \
            --require-private-comparison

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            AI_NOTICE_PUBLICATION_GATE=1
          secrets: |
            AI_NOTICE_OPERATOR_L1=${{ secrets.AI_NOTICE_OPERATOR_L1 }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.PACKAGE_TAG }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/pi0n00r/nextcloud-mcp-server
            org.opencontainers.image.url=https://github.com/pi0n00r/nextcloud-mcp-server/pkgs/container/nextcloud-mcp-server
            org.opencontainers.image.version=${{ env.PACKAGE_TAG }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.title=nextcloud-mcp-server
            org.opencontainers.image.description=Immutable v1.9.8.3 package for nextcloud-mcp-server 0.198.3

      - name: Record immutable package digest
        run: |
          {
            echo "### Immutable package"
            echo
            echo "- Tag: \`${IMAGE_NAME}:${PACKAGE_TAG}\`"
            echo "- Source: \`${PACKAGE_REVISION}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
